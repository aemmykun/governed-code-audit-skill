name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: python -m pip install -r requirements-dev.txt

      - name: Contract tests (schema + semantic invariants)
        run: python -m unittest discover -s tests -v

      - name: Packaging checks (YAML/JSON parse, reports vs schema, mock data)
        run: python tests/validate_repo.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v21
        with:
          globs: "**/*.md"
          config: ".markdownlint.json"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # --only-verified: only flag secrets verified live against their service.
      # Fixtures contain obviously fake credentials marked FAKE/EXAMPLE, which
      # never verify — the scan still catches a real secret committed by mistake.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.93.4
        with:
          extra_args: --only-verified --fail
