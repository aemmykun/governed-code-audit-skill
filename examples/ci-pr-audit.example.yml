# Example: PR audit integration with a governed code-audit skill.
#
# This is REFERENCE MATERIAL, not a ready-made workflow. It shows how a
# repository owner wires the skill into CI using their own approved agent
# endpoint. Replace every PLACEHOLDER before adapting it.
#
# Contract reminders:
#   - The agent host must be approved to process the target's source code.
#   - The skill is read-only: give it a snapshot, never write/merge/deploy
#     permissions.
#   - The report's release_gate.state is always not_evaluated. Any blocking
#     decision below is made by YOUR policy step, not by the skill.
#   - Do not run this on pull_request_target with untrusted fork code.

name: pr-audit

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write   # only for posting the report as a PR comment

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Collect audit snapshot
        run: |
          mkdir -p audit-out
          echo "${{ github.event.pull_request.head.sha }}" > audit-out/commit_sha
          git archive --format=tar "${{ github.event.pull_request.head.sha }}" \
            | sha256sum | cut -d' ' -f1 > audit-out/snapshot.sha256

      # Your approved agent endpoint reads SKILL.md + docs, receives the
      # snapshot and authorized context, and returns a report conforming to
      # schema/audit-report.schema.json. How you invoke it depends on the host —
      # e.g. an HTTP API, a queue job, or an internal orchestrator.
      - name: Invoke governed audit (PLACEHOLDER — adapt to your agent host)
        env:
          AGENT_AUDIT_ENDPOINT: ${{ secrets.AGENT_AUDIT_ENDPOINT }}
          AGENT_AUDIT_TOKEN: ${{ secrets.AGENT_AUDIT_TOKEN }}
        run: |
          curl -fsS -X POST "$AGENT_AUDIT_ENDPOINT" \
            -H "Authorization: Bearer $AGENT_AUDIT_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- <<'EOF' > audit-out/report.json
          {
            "skill": "governed-code-audit",
            "skill_version": "0.2.0",
            "audit_id": "audit-${{ github.run_id }}",
            "source": {
              "snapshot_id": "pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}",
              "commit_sha": "${{ github.event.pull_request.head.sha }}"
            },
            "requested_scopes": ["security", "maintainability"],
            "context": {
              "requirements": "doc:requirements:PLACEHOLDER",
              "coding_standards": "policy:coding-standards:PLACEHOLDER"
            }
          }
          EOF

      - name: Validate report against the contract schema
        run: |
          python -m pip install jsonschema
          python - <<'EOF'
          import json, jsonschema
          schema = json.load(open("schema/audit-report.schema.json"))
          # vendor the schema into your repo or pin it to a release tag
          report = json.load(open("audit-out/report.json"))
          jsonschema.validate(report, schema)
          print("report validates against schema 0.2.0")
          EOF

      # Optional, framework-side policy: fail the check on CONFIRMED critical
      # findings. This decision is yours — the skill never emits it.
      - name: Policy gate (external to the skill)
        run: |
          python - <<'EOF'
          import json, sys
          report = json.load(open("audit-out/report.json"))
          blocking = [
              f for f in report["findings"]
              if f["severity"] == "critical" and f["verification_status"] == "confirmed"
          ]
          if blocking:
              print(f"{len(blocking)} confirmed critical finding(s) — failing check")
              sys.exit(1)
          EOF

      - name: Post report summary as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("audit-out/report.json", "utf8"));
            const lines = [
              `### Governed code audit — ${r.audit_status}`,
              `Overall risk: ${r.overall_risk} | Release gate: ${r.release_gate.state}`,
              `Findings: ${r.findings.length} | Blocked scopes: ${r.scope.blocked.join(", ") || "none"}`,
              `Missing context: ${r.missing_context.join(", ") || "none"}`,
            ];
            github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: lines.join("\n"),
            });
