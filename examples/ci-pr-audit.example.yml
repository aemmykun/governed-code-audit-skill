# Example GitHub Actions workflow: enforceable governed audit on a PR.
#
# This file is a REFERENCE. It is fully self-contained — it runs the repo's
# own deterministic reference agent inside the OS-level sandbox, so it works
# on any fork without external services. To use a real LLM agent instead,
# replace the "Run audit agent (sandboxed)" step with a call to your endpoint
# and keep every other step identical.
#
# What this demonstrates end-to-end:
#   1. The host LOCKS the audit request before the agent runs (commit,
#      snapshot digest, scopes, approved context) — schema/audit-request.schema.json
#   2. The agent runs in an OS sandbox: no network, read-only+noexec snapshot,
#      writes confined to a workspace dir — tools/run_audit_sandbox.sh
#   3. The report is bound to the locked request AND the snapshot bytes —
#      tools/validate_report.py --request --snapshot-dir
#   4. Merge policy lives in CI, outside the agent — the gate below is YOURS
#
# Trust boundary: tools/ and schema/ are vendored host tooling. The PR under
# review CANNOT replace them — the checkout used for validation comes from
# this repository's own ref, not the PR's files. (In the demo the agent runs
# from the checked-out base ref; a stricter setup pins a released artifact.)

name: governed-audit-example
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  governed-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Audit code comes from THIS repo's checked ref — never from the
          # PR's own tree, so the PR cannot weaken the validator or gate.
          ref: ${{ github.event.repository.default_branch }}
          path: audit-host

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect audit snapshot (host-measured)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p audit-out audit-snapshot
          # Fetch the PR head tree host-side. The snapshot digest below is
          # measured by the HOST — never reported by the agent.
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$REPO/tarball/$HEAD_SHA" \
            -o audit-out/snapshot.tar.gz
          echo "$HEAD_SHA" > audit-out/commit_sha
          sha256sum audit-out/snapshot.tar.gz | cut -d' ' -f1 \
            > audit-out/snapshot.sha256
          tar -xzf audit-out/snapshot.tar.gz -C audit-snapshot --strip-components=1
          echo "security,agent_governance" > audit-out/requested_scopes

      # The LOCKED REQUEST: host-owned facts, issued before the agent starts.
      # For a real audit, supply approved context files per docs/context-contract.md;
      # a scope whose required context is absent must come back `blocked`.
      - name: Issue locked audit request
        run: |
          python - <<'EOF'
          import json, os
          req = {
            "request_version": "0.2.0",
            "audit_id": "audit-${{ github.run_id }}",
            "source": {
              "repository": "${{ github.repository }}",
              "commit_sha": open("audit-out/commit_sha").read().strip(),
              "snapshot_sha256": open("audit-out/snapshot.sha256").read().strip(),
              "snapshot_uri": "github-tarball://" + open("audit-out/commit_sha").read().strip()
            },
            "requested_scopes": ["security", "agent_governance"],
            "context": {},   # demo: no org context -> those scopes fail closed
            "agent_permissions": {
              "read_snapshot": True, "write_repository": False,
              "execute_target_code": False, "network": False,
              "disclose_externally": False, "allowed_tools": ["read_file"]
            }
          }
          json.dump(req, open("audit-out/request.json", "w"), indent=2)
          EOF

      # Agent bundle: host tooling + pinned deps, self-contained for the jail.
      - name: Build agent bundle
        run: |
          mkdir -p agent-bundle audit-out/workspace ctx
          cp -r audit-host/tools audit-host/schema agent-bundle/
          python -m pip install --target agent-bundle/pydeps -q jsonschema pyyaml

      # OS-ENFORCED read-only runtime: the agent can only read /snapshot and
      # /context; no network; no writes outside /workspace; target files are
      # noexec. This is the host's enforcement — the prompt never sees it.
      - name: Run audit agent (sandboxed)
        run: |
          cp audit-out/request.json ctx/
          audit-host/tools/run_audit_sandbox.sh \
            audit-snapshot ctx agent-bundle audit-out/workspace -- \
            env PYTHONPATH=/agent/pydeps python3 \
            /agent/tools/reference_agent.py \
            /context/request.json /snapshot /context /workspace/report.json
          cp audit-out/workspace/report.json audit-out/report.json

      # Bind the report to what the HOST locked and measured — not to what
      # the agent claims. --request checks commit_sha, scopes, audit_id;
      # --snapshot-dir checks digests AND evidence file/line ranges.
      - name: Validate report (schema + contract + request binding)
        run: |
          python -m pip install -q jsonschema pyyaml
          python audit-host/tools/validate_report.py audit-out/report.json \
            --request audit-out/request.json \
            --snapshot-dir audit-snapshot

      # External policy gate — the skill never emits gate decisions; this
      # logic is YOURS. Example policy — every cell of the severity x
      # verification matrix must land somewhere (adjust to your own):
      #   rejected/incomplete/blocked scope    -> fail (no assessment happened)
      #   confirmed critical OR confirmed high -> fail
      #   nonconfirmed high/critical           -> fail pending human review
      #   everything else                      -> pass
      - name: Policy gate (external to the skill)
        run: |
          python - <<'EOF'
          import json, sys
          r = json.load(open("audit-out/report.json"))
          if r["audit_status"] == "rejected":
              sys.exit("audit rejected — authorization or source missing")
          if r["audit_status"] == "incomplete":
              sys.exit(f"audit incomplete — blocked scopes: {r['scope']['blocked']}")
          if r["scope"]["blocked"]:
              sys.exit(f"requested scope not assessed: {r['scope']['blocked']}")
          blocking = [
              f for f in r["findings"]
              if f["severity"] in ("critical", "high")
              and f["verification_status"] == "confirmed"
          ]
          review = [
              f for f in r["findings"]
              if f["severity"] in ("critical", "high")
              and f["verification_status"] != "confirmed"
          ]
          if blocking:
              sys.exit(f"{len(blocking)} confirmed high/critical finding(s)")
          if review:
              sys.exit(f"{len(review)} high/critical finding(s) need human review")
          EOF

      - name: Summarize on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('audit-out/report.json', 'utf8'));
            const lines = [
              `### Governed audit ${r.audit_status}`,
              `- assessed: ${r.scope.assessed.join(', ') || 'none'}`,
              `- blocked: ${r.scope.blocked.join(', ') || 'none'}`,
              `- findings: ${r.findings.length}`,
              `- release gate: ${r.release_gate.state} (decision belongs to host policy)`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: lines });
